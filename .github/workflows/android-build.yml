name: Build Android APK

# Runs on every push to main, and can also be triggered manually from the Actions tab.
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # This project's Gradle wrapper jar isn't checked in (it's a binary that couldn't be
      # downloaded when the project was generated), so we install Gradle directly here instead
      # of relying on ./gradlew.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SGIS-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
